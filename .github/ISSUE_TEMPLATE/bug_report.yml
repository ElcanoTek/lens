name: Bug report
description: Something in Lens behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `python main.py --input-csv …`
        2. …
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you are running (`lens status`, or `git rev-parse --short HEAD`).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [CLI pipeline (main.py), Web dashboard, Crawl ladder / Firecrawl / deep scrape, Classification / LLM output, App store metadata, CTV pipeline, Deployment scripts, Docs]
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: Scrub your OpenRouter key and any real inventory identifiers before pasting; a couple of synthetic rows are enough.
      render: text
