name: Feature request
description: Propose an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, and why does it matter for classifying inventory?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This changes scrape-ladder or anti-bot behaviour and I have read the relevant section of AGENTS.md
