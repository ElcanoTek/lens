# Dependabot proposes updates for Lens's two dependency surfaces: the pip
# locks (requirements.in → requirements.txt / requirements-dev.txt, which
# Dependabot recompiles with pip-compile) and the GitHub Actions the workflows
# use. Modelled on fleet's .github/dependabot.yml.
#
# Dependabot PROPOSES; a human merges a bump only when it earns it — a security
# fix whose code path Lens uses, or a specific upstream commit we need (see
# "Dependencies and in-housed code" in AGENTS.md). In-housed code (html_dom.py,
# webdriver_client.py, _vendor/) is ours and is not tracked here.
#
# Daily polling with a supply-chain cooldown of 7 days (3 for patch releases):
# a freshly published release is not proposed until it is that old, so a
# compromised version the ecosystem yanks quickly never reaches review. Cooldown applies to version
# updates only; security updates are never delayed. Minor + patch bumps are
# grouped into one PR per ecosystem; majors stay separate for their own review.
# There are no `ignore` rules; if one is ever needed, say which upstream
# constraint forces it and what would let it go.
#
# Not covered: the Python interpreter (.python-version, the 3.11 floor in
# test-classification.yml and pyproject.toml) and the selenium/standalone-chrome
# image Lens pulls at runtime (config deep_scrape_image). There is no
# Containerfile in this repo, so there is no docker entry.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 3
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "deps(pip)"
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
