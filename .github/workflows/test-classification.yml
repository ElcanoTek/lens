name: Test Classification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Allow manual trigger

# The live classification steps call the OpenRouter API and need
# OPENROUTER_API_KEY. Dependabot PRs run with an empty secrets context, so that
# key is absent — instead of failing every Dependabot run, the API-backed steps
# self-skip when the key is missing (guarded on `env.OPENROUTER_API_KEY != ''`).
# The build still runs, so a gomod / github-actions bump is still exercised
# (the suite proves the binary builds); only the live classification is
# skipped. Human PRs and pushes have the secret and run fully.

# PRs share a group per ref and cancel superseded runs. Every other event
# (pushes to main, schedules) gets its own group per commit: a shared group
# keeps only one pending run, so a third push would drop the second's CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-urls:
    name: Test Website Classification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      # The same artifact a deploy installs (make build → bin/lens).
      - name: Build lens
        run: |
          make build
          ./bin/lens --version

      - name: Note skipped live run (no API key)
        if: env.OPENROUTER_API_KEY == ''
        run: |
          echo "::notice title=Classification skipped::OPENROUTER_API_KEY is not available (e.g. a Dependabot PR), so the live classification run is skipped. The binary still built successfully."

      - name: Create test input (10 URLs)
        if: env.OPENROUTER_API_KEY != ''
        run: |
          # Extract header and first 10 data rows from url_master.csv
          head -n 1 test-input/url_master.csv > input.csv
          tail -n +2 test-input/url_master.csv | head -n 10 >> input.csv
          echo "Created test input with $(wc -l < input.csv) lines (including header)"
          cat input.csv

      - name: Run classification (simple scraper)
        if: env.OPENROUTER_API_KEY != ''
        run: |
          ./bin/lens run --scrape-mode direct --quiet
        timeout-minutes: 15

      - name: Upload classification results
        if: always() && env.OPENROUTER_API_KEY != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: classification-results-urls
          path: |
            output.csv
            progress.json
            site_analysis.log
          retention-days: 7

      - name: Display results summary
        if: always() && env.OPENROUTER_API_KEY != ''
        run: |
          if [ -f output.csv ]; then
            echo "✅ Classification completed!"
            echo "Total rows in output: $(wc -l < output.csv)"
            echo ""
            echo "First 5 results:"
            head -n 6 output.csv | column -t -s ','
          else
            echo "❌ No output file generated"
          fi

  test-apps:
    name: Test App Classification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      # The same artifact a deploy installs (make build → bin/lens).
      - name: Build lens
        run: |
          make build
          ./bin/lens --version

      - name: Note skipped live run (no API key)
        if: env.OPENROUTER_API_KEY == ''
        run: |
          echo "::notice title=Classification skipped::OPENROUTER_API_KEY is not available (e.g. a Dependabot PR), so the live classification run is skipped. The binary still built successfully."

      - name: Create test input (10 apps)
        if: env.OPENROUTER_API_KEY != ''
        run: |
          # Extract header and first 10 data rows from app_list_master.csv
          head -n 1 test-input/app_list_master.csv > input.csv
          tail -n +2 test-input/app_list_master.csv | head -n 10 >> input.csv
          echo "Created test input with $(wc -l < input.csv) lines (including header)"
          cat input.csv

      - name: Run classification (simple scraper)
        if: env.OPENROUTER_API_KEY != ''
        run: |
          ./bin/lens run --scrape-mode direct --quiet
        timeout-minutes: 15

      - name: Upload classification results
        if: always() && env.OPENROUTER_API_KEY != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: classification-results-apps
          path: |
            output.csv
            progress.json
            site_analysis.log
          retention-days: 7

      - name: Display results summary
        if: always() && env.OPENROUTER_API_KEY != ''
        run: |
          if [ -f output.csv ]; then
            echo "✅ Classification completed!"
            echo "Total rows in output: $(wc -l < output.csv)"
            echo ""
            echo "First 5 results:"
            head -n 6 output.csv | column -t -s ','
          else
            echo "❌ No output file generated"
          fi

  test-ctv:
    name: Test CTV Classification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      # The same artifact a deploy installs (make build → bin/lens).
      - name: Build lens
        run: |
          make build
          ./bin/lens --version

      - name: Note skipped live run (no API key)
        if: env.OPENROUTER_API_KEY == ''
        run: |
          echo "::notice title=Classification skipped::OPENROUTER_API_KEY is not available (e.g. a Dependabot PR), so the live CTV classification run is skipped. The binary still built successfully."

      - name: Create test input (10 CTV apps)
        if: env.OPENROUTER_API_KEY != ''
        run: |
          # Extract header and first 10 data rows from CTV_Master.csv
          head -n 1 test-input/CTV_Master.csv > input.csv
          tail -n +2 test-input/CTV_Master.csv | head -n 10 >> input.csv
          echo "Created test input with $(wc -l < input.csv) lines (including header)"
          cat input.csv

      - name: Run classification (simple scraper)
        if: env.OPENROUTER_API_KEY != ''
        run: |
          ./bin/lens run --ctv --scrape-mode direct --quiet
        timeout-minutes: 15

      - name: Validate CTV output labels
        if: always() && env.OPENROUTER_API_KEY != ''
        # A real CSV parser (quoted fields carry commas), as a throwaway Go
        # program outside the module so the runner needs nothing but Go.
        run: |
          cat > "$RUNNER_TEMP/ctvcheck.go" <<'GO'
          package main

          import (
          	"encoding/csv"
          	"fmt"
          	"os"
          	"strings"
          )

          func main() {
          	f, err := os.Open("output.csv")
          	if err != nil {
          		fmt.Println("No output.csv:", err)
          		os.Exit(1)
          	}
          	r := csv.NewReader(f)
          	r.FieldsPerRecord = -1
          	rows, err := r.ReadAll()
          	if err != nil {
          		fmt.Println("output.csv does not parse:", err)
          		os.Exit(1)
          	}
          	if len(rows) == 0 {
          		fmt.Println("output.csv is empty")
          		os.Exit(1)
          	}
          	col := -1
          	for i, name := range rows[0] {
          		if strings.TrimPrefix(name, "\ufeff") == "Type" {
          			col = i
          		}
          	}
          	if col < 0 {
          		fmt.Println("Missing Type column in output.csv")
          		os.Exit(1)
          	}
          	if len(rows) < 2 {
          		fmt.Println("No rows found in output.csv")
          		os.Exit(1)
          	}
          	var wrong [][]string
          	for _, row := range rows[1:] {
          		if col >= len(row) || row[col] != "CTV" {
          			wrong = append(wrong, row)
          		}
          	}
          	if len(wrong) > 0 {
          		fmt.Printf("Found non-CTV Type values: %q\n", wrong[:min(3, len(wrong))])
          		os.Exit(1)
          	}
          	fmt.Println("CTV output validation passed.")
          }
          GO
          go run "$RUNNER_TEMP/ctvcheck.go"

      - name: Upload classification results
        if: always() && env.OPENROUTER_API_KEY != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: classification-results-ctv
          path: |
            output.csv
            progress.json
            site_analysis.log
          retention-days: 7

      - name: Display results summary
        if: always() && env.OPENROUTER_API_KEY != ''
        run: |
          if [ -f output.csv ]; then
            echo "✅ Classification completed!"
            echo "Total rows in output: $(wc -l < output.csv)"
            echo ""
            echo "First 5 results:"
            head -n 6 output.csv | column -t -s ','
          else
            echo "❌ No output file generated"
          fi
