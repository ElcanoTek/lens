name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Ruff is a static analyser, so it needs no project dependencies —
      # installing it alone keeps this job to a few seconds. The version is
      # pinned in requirements-dev.txt so local and CI runs agree; grep it out
      # rather than duplicating the number here.
      - name: Install ruff
        run: pip install "$(grep -m1 '^ruff==' requirements-dev.txt)"

      # `--output-format=github` turns findings into inline PR annotations
      # instead of burying them in the log.
      - name: Lint
        run: ruff check --output-format=github .

      # Runs even if the lint step failed, so a contributor sees formatting
      # and rule violations in one pass rather than one per push.
      - name: Format check
        if: always()
        run: ruff format --check --diff .

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # requirements-dev.txt is a fully pinned superset of the runtime lock,
      # so this single file is the whole dev environment — including httpx,
      # which backs fastapi's TestClient and used to be installed ad hoc here.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # Hermetic: the suite self-stubs OPENROUTER_API_KEY and mints its own
        # Ed25519 keys, so no secrets are needed. Covers the unified-auth
        # cookie verifier (tests/test_auth.py) + the web service.
        run: python -m pytest -q
