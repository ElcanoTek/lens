# Optional nginx reverse proxy for Lens.
#
# bootstrap.sh installs Caddy by default (deploy/lens.caddy) because it
# handles certificate issuance and renewal on its own. This file is for
# deployments that already standardise on nginx; it is NOT installed
# automatically.
#
#   1. Replace lens.example.com below with your hostname.
#   2. sudo cp deploy/nginx-lens.conf /etc/nginx/conf.d/lens.conf
#   3. sudo nginx -t && sudo systemctl enable --now nginx
#   4. sudo certbot --nginx -d lens.example.com --agree-tos --redirect
#
# Step 4 rewrites this block to listen on 443 and adds the redirect from 80.

server {
    listen 80;
    server_name lens.example.com;

    # Input lists are uploaded through the dashboard; keep this at or above
    # MAX_UPLOAD_BYTES in web_service.py (100 MB).
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8808;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-running dashboard polls; a short read timeout drops them.
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8808/health;
    }
}
