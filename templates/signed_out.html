<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signed out — Lens</title>
  <script nonce="{{ request.state.csp_nonce }}">
    (function () {
      var storageKey = "flag-theme-preference";
      var preferredTheme = null;

      try {
        preferredTheme = window.localStorage.getItem(storageKey);
      } catch (error) {
        preferredTheme = null;
      }

      var resolvedTheme;
      if (preferredTheme === "light" || preferredTheme === "dark") {
        resolvedTheme = preferredTheme;
      } else {
        var isSystemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        resolvedTheme = isSystemDark ? "dark" : "light";
      }

      document.documentElement.setAttribute("data-theme", resolvedTheme);
    })();
  </script>
  <link rel="stylesheet" href="{{ static_url('design-system/fonts/fonts.css') }}">
  <link rel="stylesheet" href="{{ static_url('design-system/tokens/design-tokens.css') }}">
  <link rel="stylesheet" href="{{ static_url('styles.css') }}">
  <link rel="icon" type="image/svg+xml" href="{{ static_url('design-system/logos/lens-favicon.svg') }}">
  <script src="{{ static_url('design-system/theme/theme-controller.js') }}"></script>
</head>
<body>
  <div class="page-shell signed-out-shell">
    <main class="panel signed-out-panel">
      <img class="signed-out-mark" src="{{ static_url('design-system/logos/elcano-mark-primary.svg') }}" alt="Elcano">
      <p class="ds-app-header__eyebrow">Lens</p>
      <h1>You are signed out</h1>
      <p class="signed-out-copy">Your Lens session has ended. Sign in again when you are ready to return.</p>
      <a class="btn btn-primary" href="/auth/login?next=%2F">Sign in again</a>
      <p class="signed-out-copy"><a href="{{ account_url }}">Manage your central account</a></p>
    </main>
  </div>
</body>
</html>
